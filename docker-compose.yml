# Production and Development configuration for Insider Threat Detection System
# Enhanced with hot reloading support for development
# docker.compose.yml

services:
    # PostgreSQL Database Service
    # Provides persistent data storage for the application
    database:
        image: postgres:15-alpine
        container_name: insider-threat-db
        
        # Database configuration
        environment:
            POSTGRES_DB: insider_threat
            POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
        
        # Persistent volume mount for data retention
        volumes:
            - postgres_data:/var/lib/postgresql/data
        
        networks:
            - app-network
        
        # Automatic restart policy
        restart: unless-stopped
        
        # Health check to ensure database is ready before dependent services start
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d insider_threat"]
            interval: 30s
            timeout: 10s
            retries: 5

    # Backend API Service
    # Handles business logic, database operations, and API endpoints
    backend:
        build: 
            context: ./backend
            dockerfile: Dockerfile
            # Use development stage for hot reloading in dev mode
            target: ${BUILD_TARGET:-production}
        
        container_name: insider-threat-backend
        
        environment:
            # Database connection settings
            DATABASE_HOST: database
            DATABASE_PORT: 5432
            DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
            DATABASE_NAME: insider_threat
            
            # Node.js runtime configuration
            NODE_ENV: ${NODE_ENV:-production}
            PORT: 3000
            
            # JWT Authentication - Critical: Must be set securely in production
            JWT_SECRET: ${JWT_SECRET:-your-dev-jwt-secret}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
            
            # Cross-Origin Resource Sharing configuration
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
            
            # CSV file processing configuration
            CSV_DROP_PATH: /app/storage/csv/drop
            CSV_PROCESSED_PATH: /app/storage/csv/processed
            CSV_ERROR_PATH: /app/storage/csv/error
            CSV_MONITOR_INTERVAL: 10000  # Monitor interval in milliseconds
        
        # Expose backend API port
        ports:
            - "3000:3000"
        
        # Wait for database to be healthy before starting
        depends_on:
            database:
                condition: service_healthy
        
        restart: unless-stopped
        
        # Mount volumes for hot reloading and CSV processing
        volumes:
            # Source code mount for hot reloading in development
            - ${BACKEND_SOURCE_MOUNT:-./backend/storage}:/app/storage
            # Conditional source mount - only in development
            - ./backend/src:/app/src:${SOURCE_MOUNT_MODE:-ro}
            - ./backend/package.json:/app/package.json:${SOURCE_MOUNT_MODE:-ro}
            - ./backend/tsconfig.json:/app/tsconfig.json:${SOURCE_MOUNT_MODE:-ro}
            - ./backend/nest-cli.json:/app/nest-cli.json:${SOURCE_MOUNT_MODE:-ro}
        
        networks:
            - app-network
        
        # Override command for development hot reloading
        command: ${BACKEND_COMMAND:-node dist/main}
        
        # Health check for backend service availability
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s  # Allow application startup time

    # Frontend Web Application
    # Next.js application serving the user interface
    frontend:
        build: 
            context: ./frontend
            dockerfile: Dockerfile
            # Use development stage for hot reloading in dev mode
            target: ${BUILD_TARGET:-production}
        
        container_name: insider-threat-frontend
        
        environment:
            # API endpoint configuration for frontend-backend communication
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
            NODE_ENV: ${NODE_ENV:-production}
            PORT: 3000
            # Enable webpack HMR for development
            WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
            CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
        
        # Expose frontend on different port to avoid conflicts
        ports:
            - "3001:3000"
        
        # Wait for backend API to be available
        depends_on:
            backend:
                condition: service_healthy
        
        restart: unless-stopped
        
        # Mount volumes for hot reloading in development
        volumes:
        # Mount source code for hot reloading - CORRECTED PATHS
        - ./frontend/src:/app/src:${SOURCE_MOUNT_MODE:-ro}
        - ./frontend/public:/app/public:${SOURCE_MOUNT_MODE:-ro}
        - ./frontend/package.json:/app/package.json:${SOURCE_MOUNT_MODE:-ro}
        - ./frontend/next.config.ts:/app/next.config.ts:${SOURCE_MOUNT_MODE:-ro}
        - ./frontend/tsconfig.json:/app/tsconfig.json:${SOURCE_MOUNT_MODE:-ro}
        - ./frontend/tailwind.config.ts:/app/tailwind.config.ts:${SOURCE_MOUNT_MODE:-ro}
        - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:${SOURCE_MOUNT_MODE:-ro}
        # Exclude node_modules and build directories
        - /app/node_modules
        - /app/.next
        
        networks:
            - app-network
        
        # Override command for development hot reloading
        command: ${FRONTEND_COMMAND:-npm start}

# Named volumes for data persistence
volumes:
    # PostgreSQL data volume - ensures data survives container restarts
    postgres_data:
        driver: local

# Custom network for service communication
networks:
    # Internal network for secure service-to-service communication
    app-network:
        driver: bridge
        # Isolates application services from external networks